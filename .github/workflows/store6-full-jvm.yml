name: Store6 full mutations JVM suite

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch: {}
  workflow_call:
    outputs:
      source_sha:
        value: ${{ jobs.validation-evidence.outputs.source_sha }}
      run_id:
        value: ${{ jobs.validation-evidence.outputs.run_id }}
      run_attempt:
        value: ${{ jobs.validation-evidence.outputs.run_attempt }}
      version:
        value: ${{ jobs.validation-evidence.outputs.version }}

permissions:
  contents: read

jobs:
  first-execution:
    uses: ./.github/workflows/store6-full-jvm-run.yml
    with:
      sequence: 1

  second-execution:
    needs: first-execution
    uses: ./.github/workflows/store6-full-jvm-run.yml
    with:
      sequence: 2

  validation-evidence:
    if: ${{ always() }}
    needs: [first-execution, second-execution]
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.evidence.outputs.source_sha }}
      run_id: ${{ steps.evidence.outputs.run_id }}
      run_attempt: ${{ steps.evidence.outputs.run_attempt }}
      version: ${{ steps.evidence.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require two executions with matching provenance
        id: evidence
        env:
          VALIDATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/release_control.py full-suite-pair --output full-suite-validation.json
      - name: Archive the full-suite validation record
        uses: actions/upload-artifact@v4
        with:
          name: full-jvm-validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: full-suite-validation.json
          if-no-files-found: error
          retention-days: 90
