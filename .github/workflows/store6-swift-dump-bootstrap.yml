# Temporary bootstrap lane: generates the store6-swift SKIE dump on a macOS runner so the
# committed dump can be added from an environment without Apple toolchains. Runs the refresh
# twice to prove the dump is byte-identical across consecutive runs, then uploads the result.
# This file is removed once the dump is committed.
name: Store6 Swift facade dump bootstrap

on:
  push:
    branches: [ matt-ramotar/store6-swift-facade-c70f ]

permissions:
  contents: read

jobs:
  refresh-swift-facade-dump:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native compiler
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Refresh the store6-swift SKIE dump
        run: ./gradlew :store6-swift:refreshSwiftDump --stacktrace

      - name: Verify the dump is identical across a second refresh
        run: |
          cp -R store6-swift/api/swift/skie /tmp/first-refresh
          ./gradlew :store6-swift:refreshSwiftDump --stacktrace
          diff -r /tmp/first-refresh store6-swift/api/swift/skie

      - name: Check the refreshed dump against the staged output
        run: ./gradlew :store6-swift:checkSwiftDump --stacktrace

      - name: Upload the refreshed dump
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: store6-swift-skie-dump-${{ github.run_id }}-${{ github.run_attempt }}
          path: store6-swift/api/swift/skie/
          if-no-files-found: error
          retention-days: 7
