name: Store6 full mutations JVM execution

on:
  workflow_call:
    inputs:
      sequence:
        type: number
        required: true
    outputs:
      source_sha:
        value: ${{ jobs.full-mutations-jvm.outputs.source_sha }}
      run_id:
        value: ${{ jobs.full-mutations-jvm.outputs.run_id }}
      run_attempt:
        value: ${{ jobs.full-mutations-jvm.outputs.run_attempt }}
      version:
        value: ${{ jobs.full-mutations-jvm.outputs.version }}

permissions:
  contents: read

jobs:
  full-mutations-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      source_sha: ${{ steps.evidence.outputs.source_sha }}
      run_id: ${{ steps.evidence.outputs.run_id }}
      run_attempt: ${{ steps.evidence.outputs.run_attempt }}
      version: ${{ steps.evidence.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Run the full mutations JVM suite
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}" || exit 1
          mkdir -p full-suite-evidence
          rm -rf mutations/build/test-results/jvmTest
          set +e
          ./gradlew :mutations:jvmTest -Pstore6.fullJvmSuite --stacktrace --console=plain 2>&1 | tee full-suite-evidence/gradle.log
          result=${PIPESTATUS[0]}
          echo "exit_code=${result}" >> "${GITHUB_OUTPUT}"
          exit "${result}"

      - name: Record task outcome and executed test identifiers
        id: evidence
        if: ${{ always() && steps.tests.outputs.exit_code != '' }}
        env:
          GRADLE_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
          EXECUTION_SEQUENCE: ${{ inputs.sequence }}
        run: >-
          python3 .github/scripts/release_control.py full-suite
          --log full-suite-evidence/gradle.log
          --results mutations/build/test-results/jvmTest
          --exit-code "${GRADLE_EXIT_CODE}"
          --sequence "${EXECUTION_SEQUENCE}"
          --output full-suite-evidence/execution.json

      - name: Archive the first result and its run provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: full-jvm-results-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.sequence }}
          path: |
            full-suite-evidence/**
            mutations/build/test-results/**/*.xml
            mutations/build/reports/tests/**
          if-no-files-found: error
          retention-days: 90

      - name: Reject missing execution evidence
        if: ${{ always() && steps.evidence.outcome != 'success' }}
        run: |
          echo "Fresh full-suite execution was not established. Inspect this run and its archived result." >> "${GITHUB_STEP_SUMMARY}"
          exit 1
