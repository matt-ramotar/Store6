# Temporary bootstrap lane: regenerates every committed Swift dump on a macOS runner so the
# rename-fallout drift can be repaired from an environment without Apple toolchains. The
# check aggregate stops at the first drifted lane, so the failing job's diagnostics never
# cover the lanes scheduled after it; this lane refreshes all of them in one run and uploads
# the refreshed files. Removed once the dumps are committed.
name: Store6 dumps bootstrap

on:
  push:
    branches: [ matt-ramotar/store6-base-repairs-c70f ]

permissions:
  contents: read

jobs:
  refresh-all-swift-dumps:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native compiler
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Refresh every committed Swift dump
        run: ./gradlew refreshSwiftDumps --stacktrace

      - name: Check the refreshed dumps
        run: ./gradlew checkSwiftDumps --stacktrace

      - name: Report refreshed files
        run: git status --porcelain

      - name: Upload the refreshed dumps
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: store6-refreshed-dumps-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            core/api/swift/
            mutations/api/swift/
          if-no-files-found: error
          retention-days: 7
