coverage:
  range: 70..80
  round: down
  precision: 2

comment:
  layout: diff, files

# Uploads from this tree carry flag `store6` (the store6 library family,
# aggregated by :coverage). Upstream main's v5 lane uploads flag `unittests`.
# Carryforward keeps each flag's last-known coverage when a commit uploads
# only the other flag.
flag_management:
  default_rules:
    carryforward: true

ignore:
  - "**/fake"
  - "**/commonTest"
  - "**/androidTest"
  - "**/iOSTest"
  - "**/jsTest"
  - "**/jvmTest"
  - "quickstart/**"
  - "mutations-quickstart/**"
  - "benchmarks/**"
  - "extension-probe/**"
  - "swift-dumps/**"
  - "compose-demo/**"
  - "devtools-demo/**"
  - "**/sample/**"
